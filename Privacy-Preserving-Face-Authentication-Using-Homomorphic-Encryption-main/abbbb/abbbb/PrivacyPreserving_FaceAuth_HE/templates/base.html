<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}FaceAuth{% endblock %}</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; margin: 0; background: #f4f6fb; color: #0f172a; }
      header { background: linear-gradient(90deg, #0f172a, #1e293b); color: #fff; padding: 16px 24px; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; }
      nav a { color: #e2e8f0; text-decoration: none; font-weight: 600; }
      nav a:hover { color: #fff; }
      main { max-width: 1100px; margin: 28px auto; padding: 0 16px; }
      .card { background: #fff; border-radius: 14px; padding: 18px 22px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); margin-bottom: 16px; }
      .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; background: #2563eb; color: #fff; text-decoration: none; border: 0; cursor: pointer; font-weight: 600; }
      .btn.secondary { background: #64748b; }
      .btn.danger { background: #dc2626; }
      .btn.ghost { background: #e2e8f0; color: #0f172a; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      label { display: block; font-weight: 600; margin: 10px 0 6px; }
      input, select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; background: #fff; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; }
      .flash { padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; }
      .flash.success { background: #ecfdf3; border: 1px solid #10b981; }
      .flash.error { background: #fef2f2; border: 1px solid #ef4444; }
      .flash.info { background: #eff6ff; border: 1px solid #3b82f6; }
      .cam-wrap { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 480px !important; margin: 0 auto; }
      .cam { width: 100% !important; max-width: 480px !important; height: 270px !important; border-radius: 14px; background: #0b1220; object-fit: cover; }
      .cam-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .preview { width: 100% !important; max-width: 480px !important; height: 270px !important; border-radius: 14px; border: 1px dashed #cbd5f5; background: #f8fafc; object-fit: cover; display: none; }
      .preview[src] { display: block; }
      footer { text-align: center; color: #64748b; padding: 16px; }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('enroll') }}">Enroll</a>
        <a href="{{ url_for('authenticate') }}">Authenticate</a>
        <a href="{{ url_for('admin_login') }}">Admin</a>
      </nav>
    </header>
    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
    <footer>Privacy-Preserving Face Authentication</footer>
  </body>
</html>
