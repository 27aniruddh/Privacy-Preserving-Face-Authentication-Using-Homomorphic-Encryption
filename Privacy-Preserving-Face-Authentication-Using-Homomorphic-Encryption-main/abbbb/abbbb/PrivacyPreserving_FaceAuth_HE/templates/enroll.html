{% extends 'base.html' %}
{% block title %}Enroll - FaceAuth{% endblock %}
{% block content %}
  <div class="card">
    <h2>Enroll User</h2>
    <form method="post" enctype="multipart/form-data">
      <input id="image_data" name="image_data" type="hidden" />

      <div class="cam-wrap">
        <video id="camera" class="cam" autoplay playsinline></video>
        <img id="preview" class="preview" alt="Captured preview" />
      </div>

      <div class="cam-actions">
        <button class="btn secondary" type="button" id="startBtn">Start Camera</button>
        <button class="btn ghost" type="button" id="captureBtn">Capture Photo</button>
      </div>

      <p id="statusMsg" class="muted" style="margin-top: 10px;"></p>

      <div id="detailsSection" style="display: none;">
        <label for="username">Username *</label>
        <input id="username" name="username" type="text" required />

        <label for="full_name">Full Name</label>
        <input id="full_name" name="full_name" type="text" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" />

        <div class="cam-actions">
          <button class="btn" type="submit" id="submitBtn" disabled>Enroll</button>
        </div>
      </div>
    </form>
  </div>

  <script>
    const camera = document.getElementById('camera');
    const preview = document.getElementById('preview');
    const imageData = document.getElementById('image_data');
    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    const detailsSection = document.getElementById('detailsSection');

    let stream;

    async function startCamera() {
      const constraints = {
        video: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          facingMode: 'user'
        },
        audio: false
      };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      camera.srcObject = stream;
      console.log('Camera started successfully');
    }

    function capture() {
      if (!camera.videoWidth || !camera.videoHeight) {
        alert('Camera not ready. Please wait a moment and try again.');
        return;
      }

      const canvas = document.createElement('canvas');
      canvas.width = camera.videoWidth;
      canvas.height = camera.videoHeight;
      const ctx = canvas.getContext('2d');
      
      // Mirror the video for better UX
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
      
      // Use high quality JPEG (0.95 quality)
      const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
      
      console.log('Image captured:', dataUrl.length, 'bytes');
      preview.src = dataUrl;
      preview.style.display = 'block';
      imageData.value = dataUrl;
    }

    async function preEnrollCheck() {
      statusMsg.textContent = 'Checking face...';
      detailsSection.style.display = 'none';
      submitBtn.disabled = true;

      const formData = new FormData();
      formData.append('image_data', imageData.value);

      try {
        const res = await fetch('/api/pre_enroll', { method: 'POST', body: formData });
        const data = await res.json();

        if (!data.face_visible) {
          statusMsg.textContent = data.message || 'Face is not properly visible. Please try again.';
          return;
        }

        if (data.already_enrolled) {
          const user = data.username || 'this user';
          statusMsg.textContent = `Already enrolled as ${user}.`;
          return;
        }

        if (data.ok) {
          statusMsg.textContent = 'Face captured. Please enter details to enroll.';
          detailsSection.style.display = 'block';
          submitBtn.disabled = false;
          return;
        }

        statusMsg.textContent = data.message || 'Unable to verify face. Please try again.';
      } catch (e) {
        statusMsg.textContent = 'Unable to verify face. Please try again.';
      }
    }

    startBtn.addEventListener('click', async () => {
      try {
        await startCamera();
        startBtn.disabled = true;
      } catch (e) {
        alert('Camera access denied or not available. Error: ' + e.message);
      }
    });

    captureBtn.addEventListener('click', () => {
      if (!stream) {
        alert('Please start the camera first.');
        return;
      }
      capture();
      preEnrollCheck();
      
      // Stop camera after capture to save resources
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        camera.style.display = 'none';
      }
    });
  </script>
{% endblock %}
